    <meta property="og:title" content="MobilSatış - Android Satış & Stok Takip" />

    <script>
      (function() {
        try {
          var pref = localStorage.getItem('theme_preference');
          if (pref === 'dark' || (!pref && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 font-sans antialiased selection:bg-emerald-500/20 selection:text-emerald-500">

  </body>
